# Tags:
# init -- for initial install and starting service
# compose-up -- for starting service
# compose-down -- for stopping service (only runs when asked for with --tags)
# proxy -- for installing and configuring Caddy

- name: Check required variables
  tags:
    - always
  ansible.builtin.assert:
    that:
      - db_password is defined
      - db_password is match('^[A-Za-z0-9]{16,}$')
    # Letters and digits only: the API builds a key=value connection string,
    # and .env parsing breaks on quotes. Generate one with: openssl rand -hex 24
    fail_msg: "Pass db_password (16+ letters/digits) with -e or an untracked vars file"
    quiet: true

- name: Install dependencies
  tags:
    - init
    - install
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker repository
  tags:
    - init
    - install
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg

- name: Install Docker and the compose plugin
  tags:
    - init
    - install
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add admin user to the docker group
  tags:
    - init
    - install
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: ["docker"]
    append: true

- name: App directories
  tags:
    - init
    - deploy
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/db"

# Postgres runs these once, when its data volume is empty
- name: Database init scripts
  tags:
    - init
    - deploy
  ansible.builtin.copy:
    src: "db/{{ item }}"
    dest: "{{ app_dir }}/db/{{ item }}"
    mode: '0755'
  loop:
    - init.sh
    - seed.sh

- name: Compose file
  tags:
    - init
    - deploy
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_dir }}/compose.yml"
    mode: '0644'

# Compose reads .env from the project directory; readable by root only
- name: Compose environment with the database password
  tags:
    - init
    - deploy
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: '0600'
  no_log: true

- name: Run Docker compose up
  tags:
    - init
    - deploy
    - compose-up
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: missing

- name: Run Docker compose down
  tags:
    - never
    - compose-down
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: absent

- name: Caddy repository
  tags:
    - init
    - proxy
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key

- name: Install Caddy
  tags:
    - init
    - proxy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Caddyfile reverse proxy to the API
  tags:
    - init
    - proxy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: '0644'
  notify: reload caddy

- name: Start Caddy
  tags:
    - init
    - proxy
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
