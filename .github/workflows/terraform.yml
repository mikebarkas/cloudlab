name: terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**/.terraform.lock.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  # Static checks only, no AWS access
  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - account/bootstrap
          - account/budget
          - account/github-oidc
          - autocorp/api/terraform
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      # Report warnings, but fail only on errors until provider versions are pinned
      - name: tflint
        run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=error --format compact

  # Plan against real state, using a read-only role through OIDC
  plan:
    name: plan (${{ matrix.dir }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # request the OIDC token for AWS
    strategy:
      fail-fast: false
      matrix:
        dir:
          - account/budget
          - autocorp/api/terraform
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=60s
