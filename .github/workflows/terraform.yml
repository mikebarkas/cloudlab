name: terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**/.terraform.lock.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  # Static checks only, no AWS access
  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - account/bootstrap
          - account/budget
          - account/github-oidc
          - autocorp/api/terraform
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      # Report warnings, but fail only on errors until provider versions are pinned
      - name: tflint
        run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=error --format compact
